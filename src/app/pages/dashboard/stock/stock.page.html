<div class="stock-page">
  <h2>Inventario</h2>

  <!-- PESTAÑAS -->
  <ul class="nav nav-tabs stock-tabs mb-3">
    <li class="nav-item" *ngFor="let t of tabs">
      <a class="nav-link" [class.active]="t===selectedTab" (click)="selectTab(t)">
        {{ t }}
      </a>
    </li>
  </ul>

  <!-- TABLA -->
  <table class="table stock-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let i of items">
        <td>{{ i.id }}</td>
        <td>{{ i.product_name }}</td>
        <td>{{ i.quantity }}</td>
        <td>{{ i.price | currency:'EUR':'symbol':'1.2-2' }}</td>
        <td>{{ i.estado }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1" (click)="openModal(i)">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger" (click)="deleteItem(i)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="items.length===0">
        <td colspan="6" class="text-center">No hay productos en {{ selectedTab }}.</td>
      </tr>
    </tbody>
  </table>

  <!-- BOTÓN AGREGAR -->
  <div class="actions">
    <button class="btn btn-primary" (click)="openModal()">
      <i class="bi bi-plus-circle"></i> Agregar Producto
    </button>
  </div>

  <!-- MODAL BOOTSTRAP -->
  <ng-template #productModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title">
        {{ form.value.id ? 'Editar Producto' : 'Agregar Producto' }}
      </h5>
      <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
      <form [formGroup]="form">
        <!-- Categoría -->
        <div class="mb-3">
          <label class="form-label">Categoría</label>
          <select class="form-select" formControlName="subcategory_id">
            <option [value]="null" disabled>-- Selecciona --</option>
            <option *ngFor="let s of subcategories" [value]="s.id">
              {{ s.name }}
            </option>
          </select>
        </div>

        <!-- Nombre -->
        <div class="mb-3">
          <label class="form-label">Producto</label>
          <input class="form-control" formControlName="product_name" />
        </div>

        <!-- Cantidad / Precio -->
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" class="form-control" formControlName="quantity" />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" class="form-control" formControlName="price" />
          </div>
        </div>

        <!-- Imagen -->
        <div class="mb-3">
          <label class="form-label">Miniatura</label>
          <input
            type="file"
            class="form-control"
            accept="image/*"
            (change)="onFileChange($event)"
          />
          <img
            *ngIf="preview"
            [src]="preview"
            class="img-thumbnail mt-2"
            style="max-height: 150px;"
          />
        </div>

        <!-- Estado -->
        <div class="mb-3">
          <label class="form-label">Estado</label>
          <select class="form-select" formControlName="estado">
            <option value="Operativo">Operativo</option>
            <option value="No operativo">No operativo</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
      <button class="btn btn-primary" [disabled]="form.invalid" (click)="save()">
        {{ form.value.id ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </ng-template>
</div>
