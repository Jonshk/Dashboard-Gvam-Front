<h2 mat-dialog-title>Subcategorías de {{ data.name }}</h2>
<mat-dialog-content>
  <table mat-table [dataSource]="data.subcategories" class="mat-elevation-z8">
    <!-- Columna ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let sub">{{ sub.id }}</td>
    </ng-container>

    <!-- Columna Nombre -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let sub">{{ sub.name }}</td>
    </ng-container>

    <!-- Columna Cantidad -->
    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Cantidad</th>
      <td mat-cell *matCellDef="let sub">{{ sub.quantity }}</td>
    </ng-container>

    <!-- Columna Precio -->
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Precio</th>
      <td mat-cell *matCellDef="let sub">{{ sub.price | currency }}</td>
    </ng-container>

    <!-- Columna Acciones -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let sub">
        <button mat-icon-button color="accent" (click)="onEdit(sub)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="onDelete(sub)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Fila de Encabezado y filas de Datos -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Formulario para Agregar / Editar Subcategoría -->
  <h3>Agregar / Editar Subcategoría</h3>
  <form [formGroup]="subcategoryForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Cantidad</mat-label>
      <input matInput type="number" formControlName="quantity">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="price">
    </mat-form-field>
    <div class="form-actions">
      <button mat-button mat-dialog-close (click)="onClose()">Cancelar</button>
      <button mat-raised-button color="primary" type="submit">
        {{ editingSubcategory ? 'Guardar Cambios' : 'Agregar Subcategoría' }}
      </button>
    </div>
  </form>
</mat-dialog-content>
