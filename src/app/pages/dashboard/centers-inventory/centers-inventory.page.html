<div class="modal-header">
    <h5 class="modal-title">
      Stock de <span class="text-success">{{ center.center }}</span>
    </h5>
    <button type="button" class="btn-close" aria-label="Close"
            (click)="modal.dismiss()"></button>
  </div>
  
  <div class="modal-body">
  
    
  
      <ul class="nav nav-tabs mb-0">
        <li class="nav-item" *ngFor="let t of tabs">
          <a class="nav-link"
             [class.active]="t === selectedTab"
             (click)="selectTab(t)">
            {{ t }}
          </a>
        </li>
      </ul>
  
     
      
  
    <!-- Tabla filtrada -->
    <table class="table table-striped mb-0">
      <thead class="table-header-custom">       
         <tr>
          <th>ID</th>
          <th>Producto</th>
          <th>Cantidad</th>
          <th>Precio</th>
          <th>Categoría</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let i of filtered">
          <td>{{ i.id }}</td>
          <td>{{ i.product_name }}</td>
          <td>{{ i.quantity }}</td>
          <td>{{ i.price | currency:'EUR':'symbol':'1.2-2' }}</td>
          <td>{{ i.category }}</td>
          <td>{{ i.estado }}</td>
          <td>
            <button class="btn btn-sm btn-outline-primary me-1"
                    (click)="editItem(i)">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger"
                    (click)="deleteItem(i)">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
        <tr *ngIf="filtered.length===0">
          <td colspan="7" class="text-center">No hay ítems en {{ selectedTab }}.</td>
        </tr>
      </tbody>
    </table>
  
    <div class="d-flex justify-content-start mt-4 mb-3">
      <button
        class="btn btn-success btn-icon-only"
        (click)="addItem()">
        <i class="bi bi-plus-circle"></i>
      </button>
    </div>
    

    <!-- Formulario de alta/edición -->
    <div *ngIf="showForm" class="border-top pt-3 mt-3">
      <form [formGroup]="form" class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Producto</label>
          <input formControlName="product_name" class="form-control" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Cantidad</label>
          <input type="number" formControlName="quantity" class="form-control" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Precio</label>
          <input type="number" step="0.01" formControlName="price" class="form-control" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Categoría</label>
          <select formControlName="category" class="form-select">
            <option value="" disabled>-- Seleccionar --</option>
            <option value="consumible">Consumible</option>
            <option value="dispositivo">Dispositivo</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Estado</label>
          <select formControlName="estado" class="form-select">
            <option value="" disabled>-- Seleccionar --</option>
            <option value="operativo">Operativo</option>
            <option value="no operativo">No operativo</option>
          </select>
        </div>
  
        <div class="col-12 text-end">
          <button class="btn btn-secondary me-2" (click)="modal.dismiss()">Cerrar</button>
          <button class="btn btn-success"
                  [disabled]="form.invalid"
                  (click)="save()">
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
