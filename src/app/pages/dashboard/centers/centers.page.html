<!-- src/app/pages/dashboard/centers/centers.page.html -->
<div class="stock-page centers-page">
  <h2>CENTROS</h2>

  <input
    class="form-control mb-3"
    type="text"
    placeholder="Buscar centro..."
    (input)="onFilterChange($event)"
  />

  <table class="table stock-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Centro</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of filteredCenters">
        <td>{{ c.id }}</td>
        <td>{{ c.center }}</td>
        <td>{{ c.phonenumber }}</td>
        <td>
          <button
            class="btn btn-sm btn-outline-success me-1"
            (click)="openInventory(c)"
            title="Ver inventario"
          >
            <i class="bi bi-box-seam"></i>
          </button>
          <button
            class="btn btn-sm btn-outline-primary me-1"
            (click)="openModal(c)"
          >
            <i class="bi bi-pencil"></i>
          </button>
          <button
            class="btn btn-sm btn-outline-danger"
            (click)="deleteCenter(c)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="filteredCenters.length === 0">
        <td colspan="4" class="text-center">No hay centros.</td>
      </tr>
    </tbody>
  </table>

  <div class="actions text-end">
    <button class="btn btn-success" (click)="openModal()">
      <i class="bi bi-plus-circle"></i> Agregar Centro
    </button>
  </div>
</div>

<!-- Modal Crear/Editar -->
<ng-template #modalContent let-modal>
  <div class="modal-header">
    <h5 class="modal-title">
      {{ editingId ? 'Editar Centro' : 'Agregar Centro' }}
    </h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="form">
      <div class="mb-3">
        <label class="form-label">Nombre del Centro</label>
        <input class="form-control" formControlName="center" />
      </div>
      <div class="mb-3">
        <label class="form-label">Teléfono</label>
        <input class="form-control" formControlName="phonenumber" />
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
    <button
      class="btn btn-success"
      [disabled]="form.invalid"
      (click)="save()"
    >
      {{ editingId ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</ng-template>
