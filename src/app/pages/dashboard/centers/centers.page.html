<!-- src/app/pages/dashboard/centers/centers.page.html -->
<div class="centers-page p-4">

  <!-- Buscador igual que en Orders/Stock -->
  <div class="search-container mb-3">
    <input
      type="text"
      class="form-control"
      placeholder="Buscar centro..."
      (input)="onFilterChange($event)"
    />
  </div>

  <table class="table table-striped table-hover centers-table">
    <thead class="bg-success text-white">
      <tr>
        <th>ID</th>
        <th>Centro</th>
        <th>Teléfono</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of filteredCenters">
        <td>{{ c.id }}</td>
        <td>
          <a href="#" (click)="openInventory(c); $event.preventDefault()">
            {{ c.center }}
          </a>
        </td>
        <td>{{ c.phonenumber }}</td>
        <td>
          <button class="btn btn-sm btn-outline-primary me-1" (click)="editCenter(c)">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn btn-sm btn-outline-danger me-1" (click)="deleteCenter(c)">
            <i class="bi bi-trash"></i>
          </button>
          <button class="btn btn-sm btn-outline-info" (click)="openInventory(c)">
            <i class="bi bi-boxes"></i>
          </button>
        </td>
      </tr>
      <tr *ngIf="filteredCenters.length===0">
        <td colspan="4" class="text-center">No hay centros.</td>
      </tr>
    </tbody>
  </table>

  <!-- Botón Agregar igual estilo que Orders -->
   <div class="action-buttons mt-3">
    <button class="btn btn-primary" (click)="addCenter()">
      <i class="bi bi-plus-circle"></i> 
    </button>
  </div>

  <!-- Modal Formulario -->
  <ng-template #formModalTpl let-modal>
    <div class="modal-header text-white">
      <h5 class="modal-title">
        {{ editingId ? 'Editar Centro' : 'Agregar Centro' }}
      </h5>
      <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
    </div>
    <div class="modal-body">
      <form [formGroup]="form" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Centro</label>
          <input class="form-control" formControlName="center" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Teléfono</label>
          <input class="form-control" formControlName="phonenumber" />
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="modal.dismiss()">Cancelar</button>
      <button class="btn btn-success" [disabled]="form.invalid" (click)="save()">
        {{ editingId ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </ng-template>
</div>
